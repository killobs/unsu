notas: 'CadEye es un producto comercial real y ampliamente usado de Fujifilm, lo que hace plausible la compra. Se encontro una referencia tentativa (fuente debil) a una torre endoscopica Fujifilm de S/ 1,579,998.00 adquirida por el hospital, sin confirmar que incluya el modulo CadEye especificamente. Clasificación de riesgo: Diagnóstico médico (ejemplo literal de la metodología §4). Estado: listado como aplicación existente en el Catálogo de Aplicaciones con IA en el Estado Peruano (PCM/SGTD).'
