notas: 'Sin informacion mas alla del catalogo oficial PCM, que para esta aplicacion no reporta tecnologia ni descripcion (''-'' en la columna de tecnologias). Limitacion de la fuente oficial misma, no de esta investigacion: un estudio academico revisado por pares (Huancapaza Hilasaca, 2025, Interfases n.22) senala que ninguna de las 22 aplicaciones del catalogo PCM analizado tiene ficha tecnica publica. Clasificación de riesgo: Apoyo documental interno. Estado: listado como aplicación existente en el Catálogo de Aplicaciones con IA en el Estado Peruano (PCM/SGTD).'
