notas: 'Presente en la linea base de Interfases (datos de agosto 2025) pero ausente en el catalogo oficial PCM mas reciente disponible (junio 2026). Estado indeterminado hasta verificar directamente con la entidad. Catalogo PCM confirma la tecnologia declarada (DeepSeek, QWen) pero no hay cobertura de prensa independiente con ese nombre exacto. Posible relacion (no confirmada) con otras iniciativas de MINEDU de la misma linea (''YachaiBot'', ''Smart Yachay Kipu'') -- no fusionar sin mas evidencia. Clasificación de riesgo: La ficha no registra finalidad; sin ella no se puede asignar nivel. Tecnologias segun Huancapaza Hilasaca (2025), Interfases n.22, que lo lista como aplicacion implementada del MINEDU. La finalidad sigue sin constar en fuente oficial bajo este nombre exacto; prensa oficial describe un programa MINEDU de soluciones offline con IA para zonas sin conectividad ("Smart Yachay Kipu"), posible relacion no confirmada. Por eso el riesgo sigue pendiente.'
