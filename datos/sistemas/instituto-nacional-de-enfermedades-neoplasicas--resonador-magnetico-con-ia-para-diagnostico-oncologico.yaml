notas: 'CONTRADICCION ENCONTRADA, no resuelta: una nota (Andina, gob.pe/INEN) reporta la puesta en marcha de un resonador 1.5T Siemens Magnetom Sola con IA. Otra nota (Gestion.pe, basada en un informe de Contraloria) advierte que un resonador del INEN NO habia entrado en funcionamiento pasado el plazo contractual, por incumplimiento del contratista en el sistema de refrigeracion (costo S/ 9,642,583). No se pudo confirmar si ambas notas se refieren al mismo equipo o a dos resonadores distintos del INEN, ni la cronologia exacta. Proveedor: Siemens Healthineers. Clasificación de riesgo: Diagnóstico médico (ejemplo literal de la metodología §4). Estado: listado como aplicación existente en el Catálogo de Aplicaciones con IA en el Estado Peruano (PCM/SGTD).'
