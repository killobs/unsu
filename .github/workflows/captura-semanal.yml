name: Captura semanal

on:
  schedule:
    - cron: "37 8 * * 0"   # domingo 03:37 hora Perú (UTC-5)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Contrataciones OECE (barrido histórico completo 2004-presente)
        run: python extractores/oece_contrataciones.py --historico
        continue-on-error: true

      - name: Planes de Gobierno Digital (sin implementar todavía)
        run: python extractores/planes_gobierno_digital.py
        continue-on-error: true

      - name: Commitear solo si cambió el contenido
        run: |
          git config user.name "registro-ia-publica-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Captura semanal automática $(date -u +%Y-%m-%d)"
          git push

      - name: Alertar si algún extractor lleva 2+ fallos seguidos
        env:
          GH_TOKEN: ${{ github.token }}
        run: python extractores/comun/alertar.py
