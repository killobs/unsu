name: Captura diaria

on:
  schedule:
    - cron: "17 9 * * *"   # 04:17 hora Perú (UTC-5), fuera de horas pico
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Contrataciones OECE (años recientes)
        run: python extractores/oece_contrataciones.py
        continue-on-error: true

      - name: PNSSP (publicación de código fuente)
        run: python extractores/pnssp.py
        continue-on-error: true

      - name: Normas gob.pe (sin implementar todavía)
        run: python extractores/normas_gobpe.py
        continue-on-error: true

      - name: Commitear solo si cambió el contenido
        run: |
          git config user.name "registro-ia-publica-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Captura diaria automática $(date -u +%Y-%m-%d)"
          git push

      - name: Alertar si algún extractor lleva 2+ fallos seguidos
        env:
          GH_TOKEN: ${{ github.token }}
        run: python extractores/comun/alertar.py
